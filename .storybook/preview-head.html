<!-- Google Analytics 4 (GA4) Tracking Injection -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-L0PMP56FGD"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  const GA_MEASUREMENT_ID = 'G-L0PMP56FGD';
  gtag('config', GA_MEASUREMENT_ID, {
    send_page_view: true
  });

  // Story route navigation tracking listeners
  function trackStoryNavigation() {
    const storyPath = window.location.hash || window.location.search || '/';
    gtag('event', 'page_view', {
      page_title: document.title || 'Storybook Component',
      page_location: window.location.href,
      page_path: storyPath
    });
  }

  window.addEventListener('hashchange', trackStoryNavigation, false);
  window.addEventListener('popstate', trackStoryNavigation, false);
</script>
